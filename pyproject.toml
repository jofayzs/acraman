[project]
name = "acraman"
version = "0.1.0"
description = "Best-case simulator for estimating bulk iridium by random laser ablation (v1)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.scripts]
acraman-sim = "acraman.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acraman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
